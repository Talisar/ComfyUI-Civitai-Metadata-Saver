[project]
name = "comfyui-talisar-pack"
description = "Talisar's ComfyUI node pack. Save Image (Civitai Metadata): writes A1111-style metadata (prompts, seed, sampler, model and LoRA hashes) that Civitai reads automatically. Traces complex graphs, LLM prompt expanders and rgthree Power Lora Loader. KoboldCpp Prompt: generates prompts with a local LLM. Review & Edit Prompt: pauses the run to review/edit a prompt."
version = "1.2.0"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/Talisar/ComfyUI-Talisar-Pack"

[tool.comfy]
DisplayName = "Talisar Node Pack"
